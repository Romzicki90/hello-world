[[test]]
id = "FIN-ADV-01"
title = "Long-pending advances to vendors"
topics = ["T7B05"]
exception_unit = "advance items"
requires = ["vendor_items.vendor", "vendor_items.doc_number", "vendor_items.posting_date", "vendor_items.amount", "vendor_items.special_gl"]
rule = """
Vendor special G/L items of the advance indicators listed below (A = down payment,
M = mobilisation advance where so configured), posted on or before the cut-off, still
open at the cut-off and older than 'pending days'.
"""
interpretation = """
Advances should be adjusted against bills as supplies / work progress. Long-pending
advances may be irrecoverable or may not carry the interest the contract provides.
"""
field_questions = [
  "Against which contract was the advance paid, and what is the adjustment schedule?",
  "Is it secured by a bank guarantee? Is the BG still valid?",
  "Is interest recoverable on the advance under the contract? Was it recovered?",
]
records_required = "Contract advance clause, BG register, adjustment schedule, vendor ledger"
population_sql = '''
SELECT count(*) AS n, sum(abs(amount)) AS value
FROM vendor_items
WHERE list_contains($advance_indicators, coalesce(special_gl, '')) AND posting_date <= $cutoff_date
  AND (clearing_date IS NULL OR clearing_date > $cutoff_date)
'''
sql = '''
SELECT concat_ws('/', company_code, fiscal_year, doc_number, vendor) AS exception_id,
       company_code, vendor, doc_number, fiscal_year, doc_type, special_gl, posting_date,
       reference, text, amount,
       date_diff('day', posting_date, $cutoff_date) AS days_outstanding,
       abs(amount) AS exception_value,
       format('Advance outstanding {} days at cut-off', date_diff('day', posting_date, $cutoff_date)) AS reason
FROM vendor_items
WHERE list_contains($advance_indicators, coalesce(special_gl, ''))
  AND posting_date <= $cutoff_date
  AND (clearing_date IS NULL OR clearing_date > $cutoff_date)
  AND date_diff('day', posting_date, $cutoff_date) > $pending_days
  AND abs(amount) >= $min_value
ORDER BY exception_value DESC
'''

[test.params.pending_days]
label = "Pending beyond (days)"
default = 180
[test.params.min_value]
label = "Minimum amount, Rs."
default = 0
[test.params.advance_indicators]
label = "Special G/L indicators for advances"
default = ["A", "M"]
