# Annexure-I: Indicative Master Catalogue of Data-Driven Audit Topics
# (Office Circular No. 53/AMG/AAP/2026-27 dated 24.07.2026, DGA (Steel), Ranchi)
#
# ID RULES (for the Data Analytics Cell as custodian of the catalogue, OO-53 para 12)
#   * A topic ID is permanent. It was assigned from the 2026-27 serial numbers
#     (T<business process><A = Priority-I | B = Priority-II><serial>) but it is
#     NOT a serial number: when the catalogue is revised, update `annex_ref`,
#     `priority` and `title`, never the `id`.
#   * A new topic takes the next unused number in its business process.
#   * Company-specific topics (OO-53 para 6) use TCSnn.
#   * A withdrawn topic is marked `withdrawn = true`, not deleted, so that old
#     working papers still resolve.
#
# mode      default mode of analysis for Tier-A companies (OO-53 para 4):
#           topics that need change logs / document modification history,
#           condition-level pricing, or HR/payroll data are "On-site".
# approval  true where the topic turns on an approval, authorisation or
#           sanction; OO-53 para 10: no approval shall be treated as verified
#           on the basis of remote analysis alone.

