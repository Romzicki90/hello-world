# Standard datasets understood by the Audit Analytics Workbench.
#
# Every analytic test is written against these standard field names only.
# Each company's SAP export is mapped onto them once (automatically, using the
# synonyms below, or explicitly in the run profile), so the same test runs on
# SAIL, MOIL or any other SAP company without change.
#
# Synonyms hold both the SAP technical field name (as exported from SE16N)
# and the English column headings of the standard ALV list displays.
# Matching ignores case, spaces and punctuation.
#
# Field types:
#   id      identifier; trimmed, upper-cased, leading zeros stripped when
#           purely numeric (SAP ALPHA conversion), so "0000100005" = "100005";
#           keep_zeros = true for codes SAP stores without that conversion
#           (plant, storage location, purchasing group, company code ...)
#   text    free text / flags; trimmed, blank becomes empty
#   date    parsed using the profile's SAP date format; "00.00.0000" = empty
#   amount  parsed using the profile's SAP decimal notation; trailing minus
#           ("1,234.00-") and brackets are negative
#   qty     as amount
#
# key = true      rows where every key field is blank are dropped as
#                 subtotal / total / blank lines (counted in Data Quality)
# sign_by         for unsigned exports: if the named Debit/Credit field is a
#                 credit indicator (H / C / Credit), a positive amount is
#                 made negative, as SAP would display it

